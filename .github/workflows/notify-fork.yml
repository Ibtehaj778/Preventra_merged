name: Notify fork of new push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fork sync
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FORK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Ibtehaj778/Preventra_GLP1_Readmission/dispatches \
            -d '{"event_type":"upstream-push"}'
