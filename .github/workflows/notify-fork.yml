name: Notify fork of new push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
        - name: Trigger fork sync
          run: |
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.FORK_DISPATCH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Ibtehaj778/Preventra_GLP1_Readmission/dispatches \
              -d '{"event_type":"upstream-push"}')
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "HTTP status: $status"
            echo "Response body: $body"
            if [ "$status" -ge 400 ]; then exit 1; fi
